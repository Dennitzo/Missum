name: missum-ai-stack

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *common
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: missum-ai-caddy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      ASSISTANT_LAN_WEB_UPSTREAM: ${ASSISTANT_LAN_WEB_UPSTREAM:-host.docker.internal:8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /data:size=16m,mode=0700
      - /config:size=16m,mode=0700
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [edge]

  gateway:
    <<: *common
    image: missum-ai/gateway:${MISSUM_AI_IMAGE_VERSION:-2.0.0}
    build:
      context: ../..
      dockerfile: src/Missum.Ai.Gateway/Dockerfile
    container_name: missum-ai-gateway
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ${MISSUM_AI_DATA_ROOT:?MISSUM_AI_DATA_ROOT is required}/data:/data
    environment:
      MISSUM_AI_DATA_DIRECTORY: /data
      MISSUM_AI_GATEWAY_PORT: "8080"
      MISSUM_AI_PUBLIC_URL: ${MISSUM_AI_PUBLIC_URL:-http://192.168.0.67:8080}
      MISSUM_AI_EXPECTED_LAN_IP: ${MISSUM_AI_EXPECTED_LAN_IP:-192.168.0.67}
      MISSUM_AI_MODEL_RUNTIME_URL: ${MISSUM_AI_MODEL_RUNTIME_URL:-http://host.docker.internal:8081}
      MISSUM_AI_CODING_MODEL_ROOT: ${MISSUM_AI_CODING_MODEL_ROOT:-C:/Users/AMD/.cache/huggingface/hub}
      MISSUM_AI_CODING_MAXIMUM_MODEL_ROUNDS: ${MISSUM_AI_CODING_MAXIMUM_MODEL_ROUNDS:-0}
      MISSUM_AI_CODING_MAXIMUM_TOOL_CALLS: ${MISSUM_AI_CODING_MAXIMUM_TOOL_CALLS:-0}
      MISSUM_AI_REASONING_ONLY_TIMEOUT_MINUTES: ${MISSUM_AI_REASONING_ONLY_TIMEOUT_MINUTES:-30}
      MISSUM_AI_SEARXNG_URL: http://searxng:8080
      MISSUM_AI_SPEECH_WORKER_URL: http://speech:8080
      MISSUM_AI_MEDIA_WORKER_URL: http://media:8080
      MISSUM_AI_IMAGE_WORKER_URL: http://image:8080
      MISSUM_AI_WORKER_DATA_DIRECTORY: /data
      NVIDIA_VISIBLE_DEVICES: all
    gpus: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:size=1g,mode=1777
    depends_on:
      searxng:
        condition: service_healthy
      speech:
        condition: service_healthy
      media:
        condition: service_healthy
      image:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /v1/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [edge, backend]

  searxng:
    <<: *common
    image: searxng/searxng@sha256:c2dc2d9e6b910653e8628361c23443222490e4cabbb9e02667b7847143db843b
    container_name: missum-ai-searxng
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ${MISSUM_AI_DATA_ROOT:?MISSUM_AI_DATA_ROOT is required}/data/cache/searxng:/var/cache/searxng
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend, egress]

  speech:
    <<: *common
    image: missum-ai/speech:${MISSUM_AI_IMAGE_VERSION:-2.0.0}
    build:
      context: ../../workers
      dockerfile: speech/Dockerfile
    container_name: missum-ai-speech
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    volumes:
      - ${MISSUM_AI_MODEL_ROOT:?MISSUM_AI_MODEL_ROOT is required}:/models:ro
      - ${MISSUM_AI_DATA_ROOT:?MISSUM_AI_DATA_ROOT is required}/data/uploads:/data/uploads:ro
      - ${MISSUM_AI_DATA_ROOT:?MISSUM_AI_DATA_ROOT is required}/data/artifacts/worker:/data/artifacts/worker
    environment:
      MISSUM_AI_WHISPER_MODEL: /models/speech/faster-whisper-large-v3
      MISSUM_AI_SPEAKER_MODEL: /models/speech/spkrec-ecapa-voxceleb
      MISSUM_AI_WHISPER_CUDA_DEVICE: "0"
      MISSUM_AI_SPEAKER_CUDA_DEVICE: "0"
      MISSUM_AI_WHISPER_FILE_BEAM_SIZE: "10"
      MISSUM_AI_WHISPER_LIVE_BEAM_SIZE: "8"
      MISSUM_AI_WHISPER_BEST_OF: "8"
      MISSUM_AI_PRELOAD_SPEECH: "1"
      MISSUM_AI_SUPERTONIC_MODEL_ROOT: /models/speech/supertonic-3
      MISSUM_AI_SUPERTONIC_VOICE: F5
      MISSUM_AI_SUPERTONIC_LANGUAGE: de
      MISSUM_AI_SUPERTONIC_STEPS: "15"
      MISSUM_AI_SUPERTONIC_MAX_CHUNK_LENGTH: "1000"
      MISSUM_AI_SUPERTONIC_CUDA_DEVICE: "1"
      CUDA_VISIBLE_DEVICES: "0,1"
      NVIDIA_VISIBLE_DEVICES: all
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    gpus: all
    shm_size: "2gb"
    mem_limit: 32g
    pids_limit: 512
    tmpfs:
      - /tmp:size=4g,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  media:
    <<: *common
    image: missum-ai/media:${MISSUM_AI_IMAGE_VERSION:-2.0.0}
    build:
      context: ../../workers
      dockerfile: media/Dockerfile
    container_name: missum-ai-media
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    volumes:
      - ${MISSUM_AI_DATA_ROOT:?MISSUM_AI_DATA_ROOT is required}/data/uploads:/data/uploads:ro
      - ${MISSUM_AI_DATA_ROOT:?MISSUM_AI_DATA_ROOT is required}/data/artifacts/worker:/data/artifacts/worker
    mem_limit: 8g
    pids_limit: 256
    tmpfs:
      - /tmp:size=6g,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [backend]

  image:
    <<: *common
    image: missum-ai/image:${MISSUM_AI_IMAGE_VERSION:-2.0.0}
    build:
      context: ../../workers
      dockerfile: image/Dockerfile
      args:
        STABLE_DIFFUSION_CPP_COMMIT: de298c225bed97c3f9026b73cd7b71e7879bd41b
    container_name: missum-ai-image
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    volumes:
      - ${MISSUM_AI_MODEL_ROOT:?MISSUM_AI_MODEL_ROOT is required}:/models:ro
      - ${MISSUM_AI_DATA_ROOT:?MISSUM_AI_DATA_ROOT is required}/data/artifacts/worker:/data/artifacts/worker
    environment:
      MISSUM_AI_Z_IMAGE_MODEL: /models/image/z-image/z_image_turbo-Q4_K.gguf
      MISSUM_AI_Z_IMAGE_VAE: /models/image/z-image/ae.safetensors
      MISSUM_AI_Z_IMAGE_ENCODER: /models/image/z-image/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      MISSUM_AI_PRELOAD_IMAGE: "0"
      MISSUM_AI_MODEL_TTL_SECONDS: "600"
      MISSUM_AI_IMAGE_LOAD_TIMEOUT_SECONDS: "1200"
      CUDA_VISIBLE_DEVICES: "1"
      NVIDIA_VISIBLE_DEVICES: all
    gpus: all
    shm_size: "2gb"
    mem_limit: 24g
    pids_limit: 256
    tmpfs:
      - /tmp:size=4g,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge
